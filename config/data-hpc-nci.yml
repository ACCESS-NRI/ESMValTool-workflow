# Read CMIP, obs4MIPs, native6, OBS6, and OBS data from the filesystem at NCI.
projects:
  CMIP6:
    data:
      oi10: &cmip6
        type: "esmvalcore.local.LocalDataSource"
        rootpath: /g/data/oi10/replicas
        dirname_template: "{project}/{activity}/{institute}/{dataset}/{exp}/{ensemble}/{mip}/{short_name}/{grid}/{version}"
        filename_template: "{short_name}_{mip}_{dataset}_{exp}_{ensemble}_{grid}*.nc"
      fs38:
        <<: *cmip6
        rootpath: /g/data/fs38/publications

  CMIP5:
    data:
      r87: &cmip5
        type: "esmvalcore.local.LocalDataSource"
        rootpath: /g/data/r87/DRSv3/CMIP5
        dirname_template: "{institute}/{dataset}/{exp}/{frequency}/{modeling_realm}/{mip}/{ensemble}/{version}/{short_name}"
        filename_template: "{short_name}_{mip}_{dataset}_{exp}_{ensemble}*.nc"
      al33:
        <<: *cmip5
        rootpath: /g/data/al33/replicas/CMIP5/combined
      rr3: &cmip5-default
        <<: *cmip5
        rootpath: /g/data/rr3/publications
        dirname_template: "{project}/{product}/{institute}/{dataset}/{exp}/{frequency}/{modeling_realm}/{mip}/{ensemble}/{version}/{short_name}"

  CMIP3:
    data:
      local:
        type: "esmvalcore.local.LocalDataSource"
        rootpath: /g/data/r87/DRSv3/CMIP3
        dirname_template: "{institute}/{dataset}/{exp}/{frequency}/{modeling_realm}/{ensemble}/{short_name}/{latestversion}"
        filename_template: "{short_name}_*.nc"

  obs4MIPs:
    data:
      local:
        type: "esmvalcore.local.LocalDataSource"
        rootpath: /g/data/qv56/replicas/obs4MIPs
        dirname_template: "{institute}/{dataset}/{frequency}/{short_name}/{grid}/{version}"
            # - '{institute}/{dataset}/{short_name}/{freq}/{version}'
            # - '{institute}/{dataset}/{realm}/{freq}/{version}/{short_name}'
            # - '{institute}/{dataset}/{realm}/{freq}/{version}'
            # - '{institute}/{dataset}/{realm}/{short_name}/{freq}/{version}'
        filename_template: "{short_name}_*.nc"

  native6:
    data:
      local: # NCI native6 ERA5 data
        type: "esmvalcore.local.LocalDataSource"
        rootpath: /g/data/rt52/era5
        dirname_template: "{level}/{nci_type}/{era5_shortname}/*"
        filename_template: "*.nc"
  OBS6:
    data:
      local:
        type: "esmvalcore.local.LocalDataSource"
        rootpath: /g/data/ct11/access-nri/replicas/esmvaltool/obsdata-v2
        dirname_template: "Tier{tier}/{dataset}"
        filename_template: "{project}_{dataset}_{type}_{version}_{mip}_{short_name}[_.]*nc"
  # OBS6:
  #   data:
  #     local:
  #       type: "esmvalcore.local.LocalDataSource"
  #       rootpath: /g/data/kj13/datasets/esmvaltool/obsdata-v2
  #       dirname_template: "Tier{tier}/{dataset}"
  #       filename_template: "{project}_{dataset}_{type}_{version}_{mip}_{short_name}[_.]*nc"
  OBS:
    data:
      local:
        type: "esmvalcore.local.LocalDataSource"
        rootpath: /g/data/ct11/access-nri/replicas/esmvaltool/obsdata-v2
        dirname_template: "Tier{tier}/{dataset}"
        filename_template: "{project}_{dataset}_{type}_{version}_{mip}_{short_name}[_.]*nc"

  ZV30:
    data:
      local:
        type: "esmvalcore.local.LocalDataSource"
        rootpath: /g/data/zv30/cmip/CMIP6
        dirname_template: "{activity}/{institute}/{dataset}/{exp}/{ensemble}/{mip}/{short_name}/{grid}/{version}"
        filename_template: "{short_name}_{mip}_{dataset}_{exp}_{ensemble}_{grid}*.nc"
    cmor_table:
      type: esmvalcore.cmor.table.CMIP6Info
      paths:
        - cmip6/Tables
        - cmip6-custom
      strict: false

  CORDEX-CMIP6:      
    data:
      CCAM: &cordex-cmip6
        type: "esmvalcore.local.LocalDataSource"
        rootpath: /g/data/hq89/CCAM/output/
        dirname_template: "CMIP6/DD/{domain}/{institute}/{driver}/{exp}/{ensemble}/{dataset}/{rcm_version}/{mip}/{short_name}/{version}"
        filename_template: "{short_name}_{domain}_{driver}_{exp}_{ensemble}_{institute}_{dataset}_{rcm_version}_{mip}*.nc"
      BARPA:
        <<: *cordex-cmip6
        rootpath: /g/data/py18/BARPA/output/
      NARClim2:
        <<: *cordex-cmip6
        rootpath: /g/data/zz63/NARCliM2-0/output/
      QldFCP:
        <<: *cordex-cmip6
        rootpath: /g/data/ig45/QldFCP-2/output/                                                                                                     
    cmor_table:
      type: esmvalcore.cmor.table.CMIP6Info
      paths:
        - /g/data/xp65/public/apps/esmvaltool/utils/extras/cordex-cmip6-cmor-tables
      strict: false                                                                                                                             
                                                                                                                            
  BARRA2:
    data:
      local:
        type: "esmvalcore.local.LocalDataSource"
        rootpath: /g/data/ob53/BARRA2/output/reanalysis
        dirname_template: "{domain}/{institute}/{driver}/{exp}/{ensemble}/{dataset}/{rcm_version}/{mip}/{short_name}/{version}"
        filename_template: "{short_name}_{domain}_{driver}_{exp}_{ensemble}_{institute}_{dataset}_{rcm_version}_{mip}*.nc"
    cmor_table:
      type: esmvalcore.cmor.table.CMIP6Info
      paths:
        - /g/data/xp65/public/apps/esmvaltool/utils/extras/cordex-cmip6-cmor-tables
      strict: false
